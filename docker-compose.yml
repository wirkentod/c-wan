networks:
  net_lan:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.10.0/24
  net_wan:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.10.0/24

services:
  # router to connect net-lan with net-wan
  vrouter:
    image: alpine:3.20.3
    container_name: vrouter
    networks:
      net_lan:
        ipv4_address: 172.16.10.11
      net_wan:
        ipv4_address: 10.0.10.11
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    command: >
      sh -c "
      apk add --no-cache curl dnsmasq &&
      IFACE_LAN=\$$(ip route get 172.16.10.11 | awk '{print \$$5}');
      IFACE_WAN=\$$(ip route get 10.0.10.11 | awk '{print \$$5}');
      if [ -n \"\$$IFACE_WAN\" ]; then
        ip route del default 2>/dev/null;
        ip route add default via 10.0.10.1 dev \$$IFACE_WAN;
      else
        echo 'Error: No se pudo determinar la interfaz WAN';
      fi;
      exec dnsmasq -k --user=root --log-dhcp --dhcp-relay=172.16.10.11,10.0.10.80 &&
      sleep infinity
      "
    restart: always

  # Contenedor Cliente Estudiante
  student:
    image: alpine:3.20.3
    container_name: h1
    networks:
      - net_lan
    cap_add:
      - NET_ADMIN
    volumes:
      - ./www:/root/www
    # Comando para simular el encendido de h1
    command: >
      sh -c "apk add --no-cache curl openssh-client && 
             curl -L https://min.io -o /usr/local/bin/mc &&
             chmod +x /usr/local/bin/mc &&
             echo 'nameserver 10.0.10.80' > /etc/resolv.conf && 
             ip addr flush dev eth0 && 
             udhcpc -i eth0 &&
             sleep infinity"

  # Contenedor Cliente Profesor  
  professor:
    image: alpine:3.20.3
    container_name: h2
    networks:
      - net_lan
    cap_add:
      - NET_ADMIN
    # Comando para simular el encendido de h2
    command: >
      sh -c "apk add --no-cache curl openssh-client && 
             echo 'nameserver 10.0.10.80' > /etc/resolv.conf && 
             ip addr flush dev eth0 && 
             udhcpc -i eth0 &&
             sleep infinity"
  
  # Servidor Web Externo
  webserver:
    image: alpine:3.20.3
    container_name: webserver
    networks:
      net_wan:
        ipv4_address: 10.0.10.60
    cap_add:
      - NET_ADMIN
    command: >
      sh -c "apk add --no-cache python3 && 
             ip route del default && 
             ip route add default via 10.0.10.11 dev eth0 &&
             mkdir -p /www && cd /www && 
             echo '¡Hola Alumno! Bienvenido al Panda Campeón 2026' > index.html && 
             python3 -m http.server 8080"
  
  sftpserver:
    image: atmoz/sftp:alpine
    container_name: sftpserver
    networks:
      net_wan:
        ipv4_address: 10.0.10.70
    # El usuario 'labtel' tendra pswd 'redes'
    #command: labtel:redes:::faci
    cap_add:
      - NET_ADMIN
    entrypoint: >
      sh -c "ip route del default && 
             ip route add default via 10.0.10.11 dev eth0 && 
             exec /entrypoint labtel:redes:::faci"
    volumes:
      - web_data:/home/labtel/faci  # Vincula la carpeta del SFTP con el servidor web

  # Servidor DHCP + DNS
  datacenter:
    image: alpine:3.20.3
    container_name: datacenter
    ports:
      - "5453:53/udp"
      - "5453:53/tcp"
    networks:
      net_wan:
        ipv4_address: 10.0.10.80
    cap_add:
      - NET_ADMIN
    volumes:
      - ./dnsmasq-config/dnsmasq.conf:/etc/dnsmasq.conf:ro
    command: >
      sh -c "apk add --no-cache dnsmasq iptables curl && 
             ip route del default && 
             ip route add default via 10.0.10.11 dev eth0 && 
             dnsmasq -k --user=root --log-facility=-"
    restart: always

  mailserver:
    image: axllent/mailpit:v1.21.1
    container_name: mailserver
    ports:
      - "1025:1025" # Puerto SMTP
      - "8025:8025" # Interfaz Web
      - "1110:1110" # POP3
    networks:
      net_wan:
        ipv4_address: 10.0.10.90
    cap_add:
      - NET_ADMIN
    environment:
      - MP_MAX_MESSAGES=100
      # Servidor SMTP se identifica con este nombre al saludar (EHLO)
      - MP_SMTP_HELO_DOMAIN=mail.pucp.edu.pe
      - MP_POP3=0.0.0.0:1110
      - MP_POP3_AUTH=telito@pucp.edu.pe:redes
    entrypoint:
      - /bin/sh
      - -c
      - |
        ip route del default
        ip route add default via 10.0.10.11 dev eth0
        exec /mailpit
    restart: always

  s3server:
    # Usamos la versión de desarrollo que contiene las herramientas del sistema necesarias
    image: cgr.dev/chainguard/minio:latest-dev
    container_name: s3server
    user: "0:0"
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Consola Web Gráfica
    networks:
      net_wan:
        ipv4_address: 10.0.10.100
    cap_add:
      - NET_ADMIN
    environment:
      - MINIO_ROOT_USER=labtel
      - MINIO_ROOT_PASSWORD=redes2026
    volumes:
      - s3_data:/data
    entrypoint:
      - /bin/bash
      - -ec
      - |
        apk add --no-cache iproute2
        ip route del default 2>/dev/null || true
        ip route add default via 10.0.10.11 dev eth0
        # Ejecuta el servidor MinIO
        exec minio server /data --console-address ":9001"
    restart: always

volumes:
  web_data:
  s3_data:
